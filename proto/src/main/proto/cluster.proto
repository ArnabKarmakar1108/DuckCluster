syntax = "proto3";

package duckcluster.v1;

option java_multiple_files = true;
option java_package = "io.duckcluster.proto.v1";
option java_outer_classname = "ClusterProto";

// Called by workers on startup and for periodic liveness.
service CoordinatorService {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);
  rpc UpdateShardOwnership(UpdateShardRequest) returns (UpdateShardResponse);
  rpc UpdateShardCache(UpdateShardCacheRequest) returns (UpdateShardCacheResponse);
}

// Called by the coordinator to reach worker nodes.
service WorkerService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc ExecuteFragment(FragmentRequest) returns (stream RowBatch);
  rpc ReadShard(ReadShardRequest) returns (stream ShardDataChunk);
  rpc ReceiveShard(stream ShardDataChunk) returns (ReceiveShardResponse);
  rpc LoadTempData(stream ShardDataChunk) returns (LoadTempDataResponse);
  rpc BeginShardPin(BeginShardPinRequest) returns (BeginShardPinResponse);
  rpc EndShardPin(EndShardPinRequest) returns (EndShardPinResponse);
  rpc MaterializeBroadcast(MaterializeBroadcastRequest) returns (MaterializeBroadcastResponse);
  rpc ClearBroadcastTables(ClearBroadcastTablesRequest) returns (ClearBroadcastTablesResponse);
  rpc CancelQuery(CancelQueryRequest) returns (CancelQueryResponse);
  rpc ActivateTableVersion(ActivateTableVersionRequest) returns (ActivateTableVersionResponse);
  // Coordinator -> source worker: hash-repartition local shards and push buckets to target workers.
  rpc ShuffleTable(ShuffleTableRequest) returns (ShuffleTableResponse);
  // Worker -> worker: one Parquet file holding a bucket's rows from one source shard.
  rpc ReceiveShufflePiece(stream ShufflePieceChunk) returns (ShufflePieceResponse);
}

message RegisterWorkerRequest {
  string worker_id = 1;
  string host = 2;
  int32 port = 3;
  int32 num_threads = 4;
  repeated ShardOwnership owned_shards = 5;
  uint32 protocol_version = 6;
}

message ColumnSchema {
  string name = 1;
  string type = 2;
}

message ShardOwnership {
  string table_name = 1;
  uint32 shard_id = 2;
  uint64 row_count = 3;
  repeated ColumnSchema columns = 4;
}

message UpdateShardRequest {
  string worker_id = 1;
  repeated ShardOwnership owned_shards = 2;
}

message UpdateShardResponse {
  bool accepted = 1;
}

message RegisterWorkerResponse {
  bool accepted = 1;
  string message = 2;
  uint64 coordinator_boot_epoch = 3;
  uint32 coordinator_protocol_version = 4;
}

message HeartbeatRequest {
  string worker_id = 1;
  double load = 2;
}

message HeartbeatResponse {
  bool healthy = 1;
  uint64 coordinator_boot_epoch = 2;
}

message PingRequest {}

message PingResponse {
  bool ok = 1;
  string worker_id = 2;
}

enum MergeHint {
  MERGE_HINT_UNSPECIFIED = 0;
  CONCAT = 1;
  PARTIAL_AGG = 2;
  GROUP_BY = 3;
  TOP_K = 4;
}

message FragmentRequest {
  string query_id = 1;
  uint32 fragment_id = 2;
  string sql = 3;
  MergeHint merge_hint = 4;
  repeated string result_column_names = 5;
}

message RowBatch {
  uint64 row_count = 1;
  repeated string column_names = 2;
  repeated Column column_values = 3;
}

enum SqlValueType {
  SQL_VALUE_TYPE_UNSPECIFIED = 0;
  SQL_VARCHAR = 1;
  SQL_BIGINT = 2;
  SQL_DOUBLE = 3;
  SQL_BOOLEAN = 4;
}

message Column {
  string name = 1;
  repeated string values = 2;
  SqlValueType type = 3;
  repeated bool nulls = 4;
}

message ReadShardRequest {
  string table_name = 1;
  uint32 shard_id = 2;
}

message ShardDataChunk {
  string table_name = 1;
  uint32 shard_id = 2;
  bytes data = 3;
  bool is_last = 4;
  string query_id = 5;
  uint64 content_length = 6;
  uint32 crc32 = 7;
  // When > 0, ReceiveShard writes under dataDir/.staging/v{staging_version}/ instead of live data.
  uint64 staging_version = 8;
}

message ReceiveShardResponse {
  bool accepted = 1;
  string message = 2;
}

message LoadTempDataResponse {
  bool accepted = 1;
  string catalog_name = 2;
}

message BeginShardPinRequest {
  string query_id = 1;
  uint64 lease_ttl_sec = 2;
}

message BeginShardPinResponse {
  bool accepted = 1;
}

message EndShardPinRequest {
  string query_id = 1;
}

message EndShardPinResponse {
  bool accepted = 1;
}

message MaterializeBroadcastRequest {
  string query_id = 1;
  string table_name = 2;
  uint32 shard_count = 3;
  // Active catalog data version; enables shared dimension materialization across queries (4.3).
  uint64 table_data_version = 4;
}

message MaterializeBroadcastResponse {
  bool accepted = 1;
  string temp_table_name = 2;
}

message ClearBroadcastTablesRequest {
  string query_id = 1;
}

message ClearBroadcastTablesResponse {
  bool accepted = 1;
}

message CancelQueryRequest {
  string query_id = 1;
}

message CancelQueryResponse {
  bool accepted = 1;
  uint32 cancelled_fragments = 2;
}

message UpdateShardCacheRequest {
  string worker_id = 1;
  repeated ShardOwnership cached_shards = 2;
}

message UpdateShardCacheResponse {
  bool accepted = 1;
}

message ActivateTableVersionRequest {
  string table_name = 1;
  uint64 version = 2;
}

message ActivateTableVersionResponse {
  bool accepted = 1;
  string message = 2;
  uint32 shards_activated = 3;
}

message ShuffleTarget {
  uint32 bucket = 1;
  string worker_id = 2;
  string host = 3;
  int32 port = 4;
}

message ShuffleTableRequest {
  string query_id = 1;
  string table_name = 2;
  repeated uint32 source_shard_ids = 3;
  string join_column = 4;
  // Join column is cast to this type before hashing so buckets line up with the driving table's shards.
  string join_key_type = 5;
  uint32 bucket_count = 6;
  repeated ShuffleTarget targets = 7;
}

message ShuffleTableResponse {
  bool accepted = 1;
  uint64 rows_shuffled = 2;
  uint32 pieces_sent = 3;
  uint64 bytes_sent = 4;
}

message ShufflePieceChunk {
  string query_id = 1;
  string table_name = 2;
  uint32 bucket = 3;
  uint32 source_shard = 4;
  bytes data = 5;
  uint64 content_length = 6;
  uint32 crc32 = 7;
}

message ShufflePieceResponse {
  bool accepted = 1;
  uint64 rows_loaded = 2;
}
