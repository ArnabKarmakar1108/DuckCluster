apiVersion: v1
kind: Service
metadata:
  name: duckcluster-worker
  headless: true
spec:
  clusterIP: None
  selector:
    app: duckcluster-worker
  ports:
    - name: grpc
      port: 9101
      targetPort: 9101
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: duckcluster-worker
spec:
  serviceName: duckcluster-worker
  replicas: 3
  selector:
    matchLabels:
      app: duckcluster-worker
  template:
    metadata:
      labels:
        app: duckcluster-worker
    spec:
      containers:
        - name: worker
          image: duckcluster:latest
          command: ["java", "-jar", "/app/worker.jar"]
          ports:
            - containerPort: 9101
          env:
            - name: DUCKCLUSTER_DATA_DIR
              value: /data
            - name: DUCKCLUSTER_COORDINATOR_HOST
              value: duckcluster-coordinator
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
