apiVersion: v1
kind: Service
metadata:
  name: duckcluster-coordinator
spec:
  selector:
    app: duckcluster-coordinator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckcluster-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duckcluster-coordinator
  template:
    metadata:
      labels:
        app: duckcluster-coordinator
    spec:
      containers:
        - name: coordinator
          image: duckcluster:latest
          command: ["java", "-jar", "/app/coordinator.jar"]
          ports:
            - containerPort: 8080
            - containerPort: 9090
          env:
            - name: DUCKCLUSTER_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /v1/cluster/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/cluster/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: duckcluster-coordinator-data
